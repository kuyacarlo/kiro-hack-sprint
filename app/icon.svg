<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- Inner shadow ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Globe outline -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <ellipse cx="256" cy="256" rx="70" ry="140" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <line x1="116" y1="256" x2="396" y2="256" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  
  <!-- Leaf icon (center) -->
  <g transform="translate(256, 256) scale(3.5)">
    <path d="M0 24V8" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 8C0-6 14-18 28-18C14-4 12 0 0 8Z" fill="url(#leaf)" fill-opacity="0.9"/>
    <path d="M0 8C0-6-14-18-28-18C-14-4-12 0 0 8Z" fill="url(#leaf)" fill-opacity="0.7"/>
  </g>
</svg>
